<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jalan Jalan Sanns Jilid 3</title>

    <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="container">

    <!-- NAVIGATION -->
    <div class="navigation-menu">
        <button id="show-countdown" class="nav-button active">
            Countdown
        </button>

        <button id="show-rundown" class="nav-button">
            Rundown Acara
        </button>

        <button id="show-gallery" class="nav-button">
            Gallery
        </button>
    </div>

    <!-- COUNTDOWN PAGE -->
    <div id="countdown-page" class="page-content">

        <div class="header">
            <h1 class="coming-soon">
                COMING SOON
            </h1>

            <br><br>

            <p class="under-construction">
                Jalan Jalan Sanns Jilid 3
            </p>

            <br><br>

            <p class="under-construction">
                1 & 2 November 2025 Puncak Bogor Villa Gadis
            </p>

            <br><br>

            <a href="#lokasi-villa"
               class="under-construction click-maps-link">
                Click For Maps Location
            </a>
        </div>

        <!-- TIMER -->
        <div class="countdown-timer">

            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">DAYS</span>
            </div>

            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">HOURS</span>
            </div>

            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">MINUTES</span>
            </div>

            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">SECONDS</span>
            </div>

        </div>

        <!-- IMAGE -->
        <div class="image-below-countdown">
            <img src="jodi.png"
                 alt="Thanks to Allah"
                 class="responsive-image">
        </div>

    </div>

    <!-- RUNDOWN PAGE -->
    <div id="rundown-page"
         class="page-content hidden">

        <h2 class="rundown-title">
            Rundown Acara JJS Jilid 3
        </h2>

        <div class="rundown-card">
            <h4>06.00</h4>
            <p class="activity">
                GATHER AT EX:POM
            </p>
        </div>

        <div class="rundown-card">
            <h4>10.00</h4>
            <p class="activity">
                ARRIVE AT THE LOCATION
            </p>
        </div>

    </div>

    <!-- GALLERY PAGE -->
    <div id="gallery-page"
         class="page-content hidden">

        <h2 class="rundown-title">
            GALLERY VILLA
        </h2>

        <div class="gallery-grid"
             id="gallery-grid">
        </div>

        <br><br>

        <h2 class="rundown-title"
            id="lokasi-villa">
            LOKASI VILLA
        </h2>

        <div class="map-container">

            <a href="https://maps.app.goo.gl/2RfCUYE8PqieN7ay6?g_st=aw"
               target="_blank"
               class="map-link-overlay">
            </a>

            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d123!2d106.9!3d-6.6"
                allowfullscreen=""
                loading="lazy">
            </iframe>

        </div>

    </div>

</div>

<!-- LIGHTBOX -->
<div id="lightbox"
     class="lightbox-overlay hidden">

    <div class="lightbox-content">

        <span class="close-btn">
            ×
        </span>

        <img id="lightbox-image"
             src=""
             alt="Gallery Image">

        <div class="lightbox-caption"></div>

        <div class="lightbox-navigation">

            <button class="prev-btn">
                ←
            </button>

            <span class="image-counter"></span>

            <button class="next-btn">
                →
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
